<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <style>
        /* Base Styles and Resets (Matching Login) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        /* Register Card Container */
        .register-container {
            background: rgba(255, 255, 255, 0.95);
            width: 100%;
            max-width: 450px; /* Slightly wider for full name */
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        /* Typography */
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 15px; /* Tighter spacing for more fields */
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* Submit Button */
        .register-btn {
            width: 100%;
            padding: 14px;
            background: #667eea;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
            margin-top: 15px;
        }

        .register-btn:hover {
            background: #5a67d8;
        }

        .register-btn:active {
            transform: scale(0.98);
        }

        /* Terms & Conditions Checkbox */
        .terms {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 13px;
            color: #666;
            cursor: pointer;
        }

        .terms input {
            width: auto;
            margin-top: 3px;
        }

        .terms a {
            color: #667eea;
            text-decoration: none;
        }

        /* Footer */
        .footer-text {
            margin-top: 25px;
            font-size: 14px;
            color: #777;
        }

        .footer-text a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        /* Feedback Message Box */
        #message-box {
            display: none;
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        .success {
            background-color: #d1fae5;
            color: #065f46;
            border: 1px solid #10b981;
        }

        .error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #f87171;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <h1>Create Account</h1>
        <p>Join us today! It only takes a minute.</p>

        <form id="registerForm">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@company.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 8 characters" required minlength="8">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="••••••••" required>
            </div>

            <label class="terms">
                <input type="checkbox" required>
                <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</span>
            </label>

            <button type="submit" class="register-btn">Create Account</button>
        </form>

        <div id="message-box"></div>

        <div class="footer-text">
            Already have an account? <a href="login.html">Sign In</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageBox = document.getElementById('message-box');
            
            messageBox.style.display = 'block';

            if (password !== confirmPassword) {
                messageBox.className = 'error';
                messageBox.textContent = 'Passwords do not match. Please try again.';
                return;
            }

            // Success feedback
            messageBox.className = 'success';
            messageBox.textContent = 'Account created successfully! Redirecting...';
            
            // Clear inputs
            this.reset();
        });
    </script>
</body>
</html>
