{% extends 'base.html' %}
{% block title %}Register — MyPartPicker{% endblock %}
{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">
            <div class="text-center mb-4">
                <i class="bi bi-person-plus-fill" style="font-size:2.5rem; color:var(--primary);"></i>
                <h2 class="fw-bold mt-2" style="color:var(--primary);">Create an Account</h2>
                <p class="text-muted">Start building your perfect Malaysian PC</p>
            </div>
            <div class="card">
                <div class="card-header"><i class="bi bi-person-plus me-2"></i>Register</div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('auth.register') }}">
                        <div class="mb-3">
                            <label class="form-label" for="username">Username</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="username" name="username" placeholder="Choose a username" required minlength="3">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="email">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="At least 6 characters" required minlength="6">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="confirm_password">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Repeat your password" required>
                            </div>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-person-check me-2"></i>Create Account
                            </button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center py-3">
                    <span class="text-muted">Already have an account?</span>
                    <a href="{{ url_for('auth.login') }}" class="fw-semibold ms-1">Log in here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% block extra_js %}
<script>
    document.querySelector('form').addEventListener('submit', function(e) {
        const pw = document.getElementById('password').value;
        const cpw = document.getElementById('confirm_password').value;
        if (pw !== cpw) { e.preventDefault(); alert('Passwords do not match.'); }
    });
</script>
{% endblock %}
{% endblock %}
