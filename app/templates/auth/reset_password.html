{% extends 'base.html' %}
{% block title %}Reset Password — MyPartPicker{% endblock %}
{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">

            <div class="text-center mb-4">
                <i class="bi bi-shield-lock-fill" style="font-size:2.5rem; color:var(--primary);"></i>
                <h2 class="fw-bold mt-2" style="color:var(--primary);">Reset Your Password</h2>
                <p class="text-muted">Choose a new password for your account</p>
            </div>

            <div class="card">
                <div class="card-header">
                    <i class="bi bi-lock me-2"></i>New Password
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">

                        <div class="mb-3">
                            <label class="form-label" for="password">New Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password"
                                       placeholder="At least 6 characters" required minlength="6">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="confirm_password">Confirm New Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" class="form-control" id="confirm_password"
                                       name="confirm_password"
                                       placeholder="Repeat your new password" required>
                            </div>
                        </div>

                        <!-- Password strength hints -->
                        <div class="alert alert-info small p-2 mb-4">
                            <i class="bi bi-info-circle me-1"></i>
                            Password must be at least <strong>6 characters</strong> long.
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-check-circle me-2"></i>Reset Password
                            </button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center py-3">
                    <a href="{{ url_for('auth.login') }}" class="small text-muted">
                        <i class="bi bi-arrow-left me-1"></i>Back to Login
                    </a>
                </div>
            </div>

        </div>
    </div>
</div>

{% block extra_js %}
<script>
    document.querySelector('form').addEventListener('submit', function (e) {
        const pw  = document.getElementById('password').value;
        const cpw = document.getElementById('confirm_password').value;
        if (pw !== cpw) {
            e.preventDefault();
            alert('Passwords do not match. Please try again.');
        }
    });
</script>
{% endblock %}
{% endblock %}
