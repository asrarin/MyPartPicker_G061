{% extends 'base.html' %}
{% block title %}Login — MyPartPicker{% endblock %}
{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">
            <div class="text-center mb-4">
                <i class="bi bi-cpu-fill" style="font-size:2.5rem; color:var(--primary);"></i>
                <h2 class="fw-bold mt-2" style="color:var(--primary);">Welcome Back</h2>
                <p class="text-muted">Log in to build and save your PC</p>
            </div>
            <div class="card">
                <div class="card-header"><i class="bi bi-box-arrow-in-right me-2"></i>Login</div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <div class="mb-3">
                            <label class="form-label" for="email">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="password">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                            </div>
                        </div>
                        <div class="text-end mb-4">
                          <a href="{{ url_for('auth.forgot_password') }}" class="small text-muted" style="text-decoration:none;">
                            <i class="bi bi-question-circle me-1"></i>Forgot your password?
                          </a>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Log In
                            </button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center py-3">
                    <span class="text-muted">Don't have an account?</span>
                    <a href="{{ url_for('auth.register') }}" class="fw-semibold ms-1">Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
